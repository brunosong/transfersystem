spring:
  application:
    name: data-migration-service
  cloud:
    config:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init-schema.sql
  datasource:
    primary:
      jdbcUrl: jdbc:postgresql://localhost:5432/datamigration?currentSchema=datamigration
      username: brunosong
      password: 1234
      driver-class-name: org.postgresql.Driver
    brunosong-online-campus:
      prod:
        jdbcUrl: jdbc:h2:mem:online_campus_prod;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
      dev:
        jdbcUrl: jdbc:h2:mem:online_campus_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
    brunosong-bootcamp:
      prod:
        jdbcUrl: jdbc:h2:mem:bootcamp_prod;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
      dev:
        jdbcUrl: jdbc:h2:mem:bootcamp_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
  data:
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          generate_statistics: true

  kafka:
    bootstrap-servers: localhost:19092, localhost:29092, localhost:39092
    properties:
      schema.registry.url: http://localhost:8081
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 5
      batch-size: 1638400
      properties:
        linger.ms: 5
        request.timeout.ms: 60000
    consumer:
      group-id: datamigration-topic-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 실제 역직렬화기는 아래 delegate 로 들어간다. 감싸지 않으면 깨진 메시지 한 건이
      # 그 파티션을 영구히 멈춘다
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      # 한 건이 오래 걸리는 적재라 한 번에 하나만 가져온다
      max-poll-records: 1
      fetch-min-size: 1
      fetch-max-wait: 5s
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        session.timeout.ms: 60000
        heartbeat.interval.ms: 15000
        max.poll.interval.ms: 1800000
        max.partition.fetch.bytes: 2097152
    listener:
      type: batch
      # 파티션 수가 상한이다. init-kafka 가 토픽을 3파티션으로 만든다
      concurrency: 3
      poll-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh

server:
  port: 8001


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    #org.apache.kafka.clients.consumer: DEBUG
#    org.springframework.transaction: debug
#    org.springframework.kafka: debug


data-migration-service:
  data-migration-request-topic-name: data-migration-request
  data-migration-response-topic-name: data-migration-response
  target-servers:
    - BRUNOSONG_ONLINE_CAMPUS
    - BRUNOSONG_BOOTCAMP

brunosong:
  servers:
    - BRUNOSONG_ONLINE_CAMPUS
    - BRUNOSONG_BOOTCAMP