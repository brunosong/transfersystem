spring:
  application:
    name: data-migration-service
  cloud:
    config:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init-schema.sql
  datasource:
    primary:
      jdbcUrl: jdbc:postgresql://localhost:5432/datamigration?currentSchema=datamigration
      username: brunosong
      password: 1234
      driver-class-name: org.postgresql.Driver
    brunosong-online-campus:
      prod:
        jdbcUrl: jdbc:h2:mem:online_campus_prod;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
      dev:
        jdbcUrl: jdbc:h2:mem:online_campus_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
    brunosong-bootcamp:
      prod:
        jdbcUrl: jdbc:h2:mem:bootcamp_prod;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
      dev:
        jdbcUrl: jdbc:h2:mem:bootcamp_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
  data:
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          generate_statistics: true

  kafka:
    bootstrap-servers: localhost:19092, localhost:29092, localhost:39092

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh

server:
  port: 8001


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    #org.apache.kafka.clients.consumer: DEBUG
#    org.springframework.transaction: debug
#    org.springframework.kafka: debug


kafka-config:
  bootstrap-servers: localhost:19092, localhost:29092, localhost:39092
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: none
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5


kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  data-migration-group-id: datamigration-topic-consumer
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  # 파티션 수가 상한이다. 이 값을 파티션보다 크게 주면 남는 스레드는 논다.
  # init-kafka 가 토픽을 3파티션으로 만든다
  concurrency-level: 3
  session-timeout-ms: 60000
  heartbeat-interval-ms: 15000
  max-poll-interval-ms: 1800000
  max-poll-records: 1
  max-partition-fetch-bytes-default: 2097152
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 2000
  # 1MB 가 쌓이거나 fetch-max-wait-ms 가 지나야 가져온다. 참조 예제의 대량 스트림 값이라
  # 요청이 띄엄띄엄 오는 이 시스템에서는 지연만 늘었다
  fetch-min-bytes: 1
  fetch-max-wait-ms: 5000

data-migration-service:
  data-migration-request-topic-name: data-migration-request
  data-migration-response-topic-name: data-migration-response
  target-servers:
    - BRUNOSONG_ONLINE_CAMPUS
    - BRUNOSONG_BOOTCAMP

brunosong:
  servers:
    - BRUNOSONG_ONLINE_CAMPUS
    - BRUNOSONG_BOOTCAMP