spring:
  application:
    name: data-migration-service
  config:
    import: "optional:configserver:http://config-service.transfer.svc.cluster.local:8888/"
  cloud:
    bus:
      enabled: true
      refresh:
        enabled: true
      id: ${spring.application.name}:${spring.profiles.active:dev}:${random.uuid}
    compatibility-verifier:
      enabled: false
    config:
      profile: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init-schema.sql

  datasource:
    primary:
      jdbcUrl: jdbc:postgresql://${POSTGRE_HOST}:${POSTGRE_PORT}/datamigration?currentSchema=datamigration
      username: ${POSTGRE_USERNAME}
      password: ${POSTGRE_PASSWORD}
      driver-class-name: org.postgresql.Driver
    brunosong-online-campus:
      prod:
        jdbcUrl: jdbc:mysql://transfer-mysql-prod-0.transfer-mysql-prod.transfer.svc.cluster.local/onlinecampus
        username: ${MYSQL_PROD_USERNAME}
        password: ${MYSQL_PROD_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
      dev:
        jdbcUrl: jdbc:mysql://transfer-mysql-dev-0.transfer-mysql-dev.transfer-dev.svc.cluster.local/onlinecampus
        username: ${MYSQL_DEV_USERNAME}
        password: ${MYSQL_DEV_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    brunosong-bootcamp:
      prod:
        jdbcUrl: jdbc:mysql://transfer-mysql-prod-0.transfer-mysql-prod.transfer.svc.cluster.local/bootcamp
        username: ${MYSQL_PROD_USERNAME}
        password: ${MYSQL_PROD_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
      dev:
        jdbcUrl: jdbc:mysql://transfer-mysql-dev-0.transfer-mysql-dev.transfer-dev.svc.cluster.local/bootcamp
        username: ${MYSQL_DEV_USERNAME}
        password: ${MYSQL_DEV_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: true
  kafka:
    bootstrap-servers: kafka-broker-0.kafka-broker.kafka.svc.cluster.local:9092

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh

server:
  port: 8001


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    #org.apache.kafka.clients.consumer: DEBUG
#    org.springframework.transaction: debug
#    org.springframework.kafka: debug

