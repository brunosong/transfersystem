apiVersion: v1
kind: ConfigMap
metadata:
  name: target-agent-configmap
  namespace: transfer
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka-broker-0.kafka-broker.kafka.svc.cluster.local:9092
  SCHEMA_REGISTRY_SERVER: schema-registry-0.schema-registry-service.kafka.svc.cluster.local:8081
  MYSQL_PROD_USERNAME: brunosong
  MYSQL_PROD_PASSWORD: asdf1234
  MYSQL_DEV_USERNAME: brunosong
  MYSQL_DEV_PASSWORD: asdf1234
  POSTGRE_HOST: transfer-postgres-0.postgres-headless.transfer.svc.cluster.local
  POSTGRE_PORT: "5432"
  POSTGRE_USERNAME: brunosong
  POSTGRE_PASSWORD: "1234"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-agent-server
  namespace: transfer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: target-agent-server
  template:
    metadata:
      labels:
        app: target-agent-server
    spec:
      containers:
        - name: target-agent-container
          imagePullPolicy: Always
          image: airtrack1234/target-agent:1.0.1
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
          envFrom:
            - configMapRef:
                name: target-agent-configmap
          resources:
            requests:
              memory: "1024Mi"
              cpu: "1000m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

---
apiVersion: v1
kind: Service
metadata:
  name: target-agent
  namespace: transfer
spec:
  selector:
    app: target-agent
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080