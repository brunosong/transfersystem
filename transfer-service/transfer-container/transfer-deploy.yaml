apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-server
  namespace: transfer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: transfer-server
    template:
      metadata:
        labels:
          app: transfer-server
      spec:
        containers:
          - name: transfer-container
            image:
            env:
              - name: SPRING_PROFILES_ACTIVE
                value: dev
            envFrom:
              - configMapRef:
                  name: mongodb-config
              - configMapRef:
                  name: postgre-config
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "sleep 10"]
            readinessProbe:
              httpGet:
                path: /healthcheck/ready
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 1
              successThreshold: 1
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /healthcheck/live
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 1
              failureThreshold: 7

