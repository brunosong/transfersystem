spring:
  application:
    name: transfer-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  cloud:
    config:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:init-schema.sql
  data:
    mongodb:
      uri: mongodb://root:example@localhost:27017/exampledb?authSource=admin
  datasource:
    url: jdbc:postgresql://localhost:5432/transfer
    username: brunosong
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: true
  kafka:
    bootstrap-servers: localhost:19092, localhost:29092, localhost:39092



management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
#    org.springframework.cloud: DEBUG
#    org.springframework.kafka: DEBUG
#    org.springframework.cloud.bus: TRACE



transfer-service:
  data-migration-request-topic-name: data-migration-request
  data-migration-response-topic-name: data-migration-response
  data-migration-schema-subjects:
    - avro/DataMigrationRequestAvroModel.avsc
  outbox-scheduler:
    initial-delay: 10000
    fixed-delay: 10000

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: full


kafka-config:
  bootstrap-servers: kafka-broker-0.kafka-broker.kafka.svc.cluster.local:9092
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://schema-registry-0.schema-registry-service.kafka.svc.cluster.local:8081
  num-of-partitions: 3
  replication-factor: 1

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: none
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5
  request-max-size: 15000000

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  transfer-group-id: transfer-topic-consumer
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  # 파티션 수가 상한이다. 이 값을 파티션보다 크게 주면 남는 스레드는 논다.
  # init-kafka 가 토픽을 3파티션으로 만든다
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150
  # 1MB 가 쌓이거나 fetch-max-wait-ms 가 지나야 가져온다. 참조 예제의 대량 스트림 값이라
  # 요청이 띄엄띄엄 오는 이 시스템에서는 지연만 늘었다
  fetch-min-bytes: 1
  fetch-max-wait-ms: 2000

brunosong:
  servers: BRUNOSONG_ONLINE_CAMPUS, BRUNOSONG_BOOTCAMP

