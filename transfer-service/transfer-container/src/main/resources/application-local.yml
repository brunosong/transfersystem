spring:
  application:
    name: transfer-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  cloud:
    config:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:init-schema.sql
  data:
    mongodb:
      uri: mongodb://root:example@localhost:27017/exampledb?authSource=admin
  datasource:
    url: jdbc:postgresql://localhost:5432/transfer
    username: brunosong
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: true
  kafka:
    bootstrap-servers: localhost:19092, localhost:29092, localhost:39092
    # 생산자와 소비자가 함께 쓰는 것
    properties:
      schema.registry.url: http://localhost:8081
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 5
      batch-size: 1638400
      properties:
        linger.ms: 5
        request.timeout.ms: 60000
        # 청크를 실어 보내므로 크게 잡는다. 브로커의 message.max.bytes 와 맞아야 한다
        max.request.size: 15000000
    consumer:
      group-id: transfer-topic-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 실제 역직렬화기는 아래 delegate 로 들어간다. 이렇게 감싸지 않으면 깨진 메시지가
      # poll 단계에서 터지고 건너뛸 방법이 없어 그 파티션이 영구히 멈춘다
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      max-poll-records: 500
      # 참조 예제는 1MB 였다. 요청이 띄엄띄엄 오는 이 시스템에서는 지연만 늘었다
      fetch-min-size: 1
      fetch-max-wait: 2s
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000
        max.partition.fetch.bytes: 1048576
    listener:
      type: batch
      # 파티션 수가 상한이다. init-kafka 가 토픽을 3파티션으로 만든다
      concurrency: 3
      poll-timeout: 150ms



management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
#    org.springframework.cloud: DEBUG
#    org.springframework.kafka: DEBUG
#    org.springframework.cloud.bus: TRACE



transfer-service:
  data-migration-request-topic-name: data-migration-request
  data-migration-response-topic-name: data-migration-response
  data-migration-schema-subjects:
    - avro/DataMigrationRequestAvroModel.avsc
  outbox-scheduler:
    initial-delay: 10000
    fixed-delay: 10000

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: full


brunosong:
  servers: BRUNOSONG_ONLINE_CAMPUS, BRUNOSONG_BOOTCAMP

