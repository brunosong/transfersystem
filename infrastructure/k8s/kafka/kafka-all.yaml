# ZooKeeper StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: kafka
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.0
          ports:
            - containerPort: 2181
              name: client
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

---
# ZooKeeper Service
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: kafka
spec:
  ports:
    - port: 2181
      targetPort: 2181
      name: client
  selector:
    app: zookeeper
  clusterIP: None

---
# Kafka 브로커 StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: kafka
spec:
  serviceName: kafka-broker
  replicas: 3
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 19092
              name: local-1
            - containerPort: 29092
              name: local-2
            - containerPort: 39092
              name: local-3
          env:
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,LISTENER_LOCAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_COMPRESSION_TYPE
              value: "producer"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "15728640"
          # KAFKA_BROKER_ID를 동적으로 설정하기 위해 command 추가
          command:
            - sh
            - -c
            - |
              export KAFKA_BROKER_ID=${HOSTNAME##*-} && \
              export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker-${KAFKA_BROKER_ID}.kafka-broker.kafka.svc.cluster.local:9092,LISTENER_LOCAL://localhost:$([ ${KAFKA_BROKER_ID} -eq 0 ] && echo 19092 || [ ${KAFKA_BROKER_ID} -eq 1 ] && echo 29092 || echo 39092) && \
              exec /etc/confluent/docker/run
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

---
# Kafka 브로커 Service
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: kafka
spec:
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext
    - port: 19092
      targetPort: 19092
      name: local-1
      nodePort: 30001
    - port: 29092
      targetPort: 29092
      name: local-2
      nodePort: 30002
    - port: 39092
      targetPort: 39092
      name: local-3
      nodePort: 30003
  selector:
    app: kafka-broker
  type: NodePort
---
# Kafka 브로커 헤드리스 서비스
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker-service
  namespace: kafka
spec:
  clusterIP: None
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext
    - port: 19092
      targetPort: 19092
      name: local-1
    - port: 29092
      targetPort: 29092
      name: local-2
    - port: 39092
      targetPort: 39092
      name: local-3
  selector:
    app: kafka-broker