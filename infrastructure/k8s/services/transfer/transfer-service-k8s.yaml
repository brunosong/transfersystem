apiVersion: v1
kind: ConfigMap
metadata:
  name: transfer-configmap
  namespace: transfer
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka-broker-0.kafka-broker.kafka.svc.cluster.local:9092
  SCHEMA_REGISTRY_SERVER: schema-registry-0.schema-registry-service.kafka.svc.cluster.local:8081
  MONGODB_USERNAME: root
  MONGODB_PASSWORD: example
  MONGODB_HOST: mongodb-0.mongodb-headless.transfer.svc.cluster.local
  MONGO_PORT: "27017"
  POSTGRE_HOST: transfer-postgres-0.postgres-headless.transfer.svc.cluster.local
  POSTGRE_PORT: "5432"
  POSTGRE_USERNAME: brunosong
  POSTGRE_PASSWORD: "1234"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-server
  namespace: transfer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: transfer-server
  template:
    metadata:
      labels:
        app: transfer-server
    spec:
      containers:
        - name: transfer-container
          image: airtrack1234/transfer-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
          envFrom:
            - configMapRef:
                name: transfer-configmap
          resources:
            requests:
              memory: "1024Mi"
              cpu: "1000m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /healthcheck/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 1
            failureThreshold: 7
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-service
  namespace: transfer
spec:
  selector:
    app: transfer-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080