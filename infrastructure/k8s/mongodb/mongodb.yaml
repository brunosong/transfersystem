# ConfigMap for mongo-init.js
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-script
  namespace: transfer
data:
  mongo-init.js: |
    db = db.getSiblingDB('exampledb');
    db.createRole({
      role: "learningMaterialsRole",
      privileges: [
        { resource: { db: "exampledb", collection: "learning_materials" }, actions: ["find", "insert", "update", "remove"] }
      ],
      roles: []
    });
    db.createUser({
      user: "learning_user",
      pwd: "learning_pass123",
      roles: [{ role: "learningMaterialsRole", db: "exampledb" }]
    });
    db.learning_materials.insertMany([
        {
          "title": "Introduction to Java",
          "description": "Basic Java programming concepts",
          "learningLevel": 1,
          "metadataList": [
            { "attributeName": "John Doe", "attributeValue": "120" },
            { "attributeName": "PDF", "attributeValue": "English" }
          ]
        },
        {
          "title": "Advanced Java",
          "description": "In-depth Java programming techniques",
          "learningLevel": 3,
          "metadataList": [
            { "attributeName": "Jane Smith", "attributeValue": "300" },
            { "attributeName": "eBook", "attributeValue": "English" }
          ]
        },
        {
          "title": "Spring Boot Basics",
          "description": "Getting started with Spring Boot",
          "learningLevel": 2,
          "metadataList": [
            { "attributeName": "Alex Brown", "attributeValue": "200" },
            { "attributeName": "Video", "attributeValue": "English" }
          ]
        }
    ]);

---

# Secret for MongoDB credentials
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: transfer
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: cm9vdA==
  MONGO_INITDB_ROOT_PASSWORD: ZXhhbXBsZQ==

---

# StatefulSet for MongoDB
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: transfer
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/mongo-init.js
              subPath: mongo-init.js
      volumes:
        - name: init-script
          configMap:
            name: mongodb-init-script
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: local-path  # Use local-path or manual
---

# Service for MongoDB
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: transfer
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
      nodePort: 30017
  type: NodePort

