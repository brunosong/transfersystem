apiVersion: v1
kind: Service
metadata:
  name: mysql-dev-service
  namespace: transfer-dev
spec:
  clusterIP: None
  selector:
    app: transfer-mysql-dev
  ports:
    - protocol: TCP
      port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-prod-service
  namespace: transfer
spec:
  clusterIP: None
  selector:
    app: transfer-mysql-prod
  ports:
    - protocol: TCP
      port: 3306
