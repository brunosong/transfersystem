version: '3.7'

services:
  transfer-postgres:
    image: postgres:15
    container_name: transfer-postgres
    environment:
      POSTGRES_USER: brunosong
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: transfer
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data  # 데이터 영속성
      - ./postgres-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql  # 초기화 스크립트
#    networks:
#      - ${GLOBAL_NETWORK:-postgres}

volumes:
  postgres-data:
    driver: local