spring:
  application:
    name: authoring-service
  data:
    mongodb:
      # 배포가 읽는 learningDB 를 같이 쓴다(docs/system/authoring.md 1절).
      # Mongo 는 단일 노드 레플리카 셋(rs0)이다. 공개를 트랜잭션으로 묶는다
      uri: mongodb://root:example@localhost:27017/learningDB?authSource=admin
      # @Indexed 를 보고 인덱스를 만든다. Spring Boot 는 기본으로 꺼 둔다(운영 DB에 모르는 사이 인덱스가 생기지 않게).
      # 로컬에서는 켜 둔다. 운영에서는 인덱스를 따로 만들고 끈다
      auto-index-creation: true

server:
  port: 8002

logging:
  level:
    # Mongo 에 어떤 명령이 나가는지 본다. find, insert, update 의 조건과 바꾸는 값이 찍힌다.
    # 예) Calling update using query: { "_id" : "CUR001", "revision" : 5} and update: { "$set" : { ... } }
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    # 드라이버가 실제로 보낸 명령과 걸린 시간까지 보려면 아래를 켠다(아주 많이 찍힌다)
    # org.mongodb.driver.protocol.command: DEBUG
