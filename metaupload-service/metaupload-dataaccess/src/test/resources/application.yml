spring:
  redis:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 2
    host: localhost   # Redis 서버 호스트
    port: 6379        # Redis 서버 포트
    password:    # (선택 사항)
    timeout: 60000    # 타임아웃 설정

  # datasource 설정
  datasource:
    hikari:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:wjcmsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password: